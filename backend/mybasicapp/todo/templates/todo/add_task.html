<!DOCTYPE html>
<html>
<head>
    <title>Add task</title>
</head>
<body>
    <h1>Add task</h1>
    {% if error_message %}
        <p><strong>{{error_message}}</strong></p>
    {% endif %}
    <form method="post" action="{% url 'todo:add_task' %}">
        {% csrf_token %}
        {{form.as_p}}
        <input type="submit" value="Add task">
    </form>
</body>
</html>
