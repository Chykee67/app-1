<!DOCTYPE html>
<html>
<head>
    <title>Task list</title>
</head>

<body>
    <h1>Task list</h1>
    <ol>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% endfor %}
    </ol>

    <p>
        <button type="button" onclick="window.location.href = '/todo/add_task/';">Add Task</button>
    </p>
    
    <p>
        <button type="button" onclick="window.location.href = '/user_auth/signout/';">Signout</button>
    </p>
</body>
</html>
