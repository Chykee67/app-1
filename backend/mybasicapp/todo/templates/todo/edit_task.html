<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>
    <h1>{{task.title|title}}</h1>
    <p>
        <strong>
            {% if error_message %}{{error_message}}{% endif %}
        </strong>
    </p>
    <form method="post" action="{% url 'todo:edit_task' task.id %}">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">Save</button>
        </p>
    </form>
</body>
</html>
