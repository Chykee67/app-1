services:
  proxy:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - my-network
    depends_on:
      - web-app
  
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
      - "--log"
      - "stdout"
      - "--log-level"
      - "info"
      - "--log-format"
      - "json"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - 4040:4040
    network_mode: "host"
      
  
  web-app:
    image: ubuntu:latest
    volumes:
      - ./backend:/backend:ro
    entrypoint: ["backend/backend_script.sh"]
    networks:
      - my-network

networks:
  my-network:
    driver: bridge