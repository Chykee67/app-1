services:
  proxy:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - my-network
    depends_on:
      - web-app
    
  
  web-app:
    image: ubuntu:latest
    volumes:
      - ./backend:/backend:ro
    entrypoint: ["backend/backend_script.sh"]
    networks:
      - my-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - 'start'
      - '--all'
      - '--config'
      - '/etc/ngrok.yml'
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
      - ./ngrok.log:/var/log/ngrok.log:rw
    ports:
      - 4040:4040

networks:
  my-network:
    driver: bridge