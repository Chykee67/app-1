services:
  proxy:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - backend_server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./staticfiles:/staticfiles:rw
    networks:
      - app_network

  backend_server:
    image: ubuntu:latest
    volumes:
      - ./backend/:/backend/
    entrypoint: ["./backend/backend_script.sh"]
    networks:
      - app_network

networks:
  app_network:
    driver: bridge