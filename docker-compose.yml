services:
  proxy:
    image: chykee67/proxy:v1
    restart: unless-stopped
    depends_on:
      - backend_server
    ports:
      - "80:80"
    volumes:
      - ./staticfiles:/staticfiles:rw
      - ./mediafiles:/mediafiles:rw
    networks:
      - app_network

  backend_server:
    image: chykee67/backend_server:v1
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./mediafiles
        target: /mediafiles
      - type: bind
        source: ./staticfiles
        target: /staticfiles
    networks:
      - app_network

networks:
  app_network:
    driver: bridge