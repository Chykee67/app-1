<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Temperature Conversion app</h1>

    <form id="temp-converter">
        <input type="number" id="temp-input" placeholder="Enter temperature" required>
        <select id="temp-scale" name="temp-scale">
            <option value="celsius">Celsius to Fahrenheit</option>
            <option value="fahrenheit">Fahrenheit to Celsius</option>
        </select><br><br>
        <input type="submit" value="Convert" id="convert-btn">
        <p id="result"></p>
    </form>
    
    <script src="index.js"></script>
</body>
</html>
