apiVersion: v1
kind: Service
metadata:
  name: myapp-backend-service
  namespace: practice-ns
spec:
  type: ClusterIP
  selector:
    app: myapp-backend
  ports:
    - port: 3031
      targetPort: 3031
      protocol: TCP
      name: backend-port

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-proxy-service
  namespace: practice-ns
spec:
  type: NodePort
  selector:
    app: myapp-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080