apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
  - name: my-container
    image: busybox
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: my-local-volume
      mountPath: /local-volume/
  volumes:
  - name: my-local-volume
    persistentVolumeClaim:
      claimName: local-pvc