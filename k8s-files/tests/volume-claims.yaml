apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostpath-pvc
  namespace: practice-ns
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: hostpath-volume
  storageClassName: ""
  volumeMode: Filesystem
  resources:
    limits:
      storage: 5M
    requests:
      storage: 5M

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-pvc
  namespace: practice-ns
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: local-volume
  storageClassName: ""
  volumeMode: Filesystem
  resources:
    limits:
      storage: 5M
    requests:
      storage: 5M
